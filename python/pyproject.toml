[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-sdk"
version = "0.1.0"
description = "Python scripting for RS-SDK bots through the local pybridge process"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["rs"]

[tool.setuptools.package-data]
rs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
